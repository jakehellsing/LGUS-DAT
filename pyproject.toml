[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgus-dat"
version = "0.31.0"
description = "MB10-VL Sequential IN/OUT .DAT Processor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jake Hellsing" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "reportlab>=4.0.0",
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
lgus-dat = "lgus_dat.cli.commands:main"
lgus-dat-desktop = "lgus_dat.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]
