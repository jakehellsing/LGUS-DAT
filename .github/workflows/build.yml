name: Build Executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            windowed: --windowed
          - os: ubuntu-latest
            name: linux
            windowed: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Get version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pyinstaller --onedir ${{ matrix.windowed }} --name "lgus-dat-desktop-V${{ steps.version.outputs.VERSION }}" --distpath dist/desktop --workpath build/desktop --noconfirm src/lgus_dat/desktop/app.py

      - name: Zip bundle
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          python -c "import shutil; shutil.make_archive(f'dist/desktop/lgus-dat-desktop-V${VERSION}', 'zip', f'dist/desktop/lgus-dat-desktop-V${VERSION}')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lgus-dat-desktop-${{ matrix.name }}
          path: dist/desktop/lgus-dat-desktop-V${{ steps.version.outputs.VERSION }}.zip
