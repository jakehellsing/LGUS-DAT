name: Build Executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            ext: .exe
            windowed: --windowed
          - os: ubuntu-latest
            name: linux
            ext: ""
            windowed: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile ${{ matrix.windowed }} --name LGUS-DAT scripts/gui_entry.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LGUS-DAT-${{ matrix.name }}
          path: dist/LGUS-DAT${{ matrix.ext }}
